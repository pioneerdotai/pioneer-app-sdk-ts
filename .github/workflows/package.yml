name: Build and publish SDK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Assign main build version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          base_version=$(node -p "require('./package.json').version")
          npm version "${base_version}-main.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" --no-git-tag-version --ignore-scripts --package-lock=false
      - run: bun run build
      - run: bun run test
      - run: bun run test:package
      - name: Pack built SDK
        run: |
          mkdir release-package
          npm pack --ignore-scripts --pack-destination release-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-package
          path: release-package/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: sdk-npm
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-package
          path: release-package
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.21.0 --ignore-scripts --registry=https://registry.npmjs.org
      - name: Publish tested SDK archive
        run: |
          tag=main
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$main_sha" = "$GITHUB_SHA" ]; then tag=latest; fi
          npm publish release-package/*.tgz --ignore-scripts --access public --tag "$tag" --registry=https://registry.npmjs.org
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
