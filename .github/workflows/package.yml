name: Publish SDK

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: sdk-npm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - name: Validate release tag
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must use vX.Y.Z (for example v0.1.1).' >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v${package_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}." >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Pack release SDK
        run: |
          mkdir release-package
          npm pack --ignore-scripts --pack-destination release-package
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.21.0 --ignore-scripts --registry=https://registry.npmjs.org
      - name: Publish release SDK archive
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo 'GitHub did not provide OIDC credentials; id-token: write is required.' >&2
            exit 1
          fi
          npm publish ./release-package/*.tgz --ignore-scripts --access public --tag latest --registry=https://registry.npmjs.org
